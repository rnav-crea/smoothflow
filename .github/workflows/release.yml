name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux system deps (tauri + cpal/alsa + AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential pkg-config curl wget file libxdo-dev libssl-dev libasound2-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install LLVM (libclang for bindgen)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Collect and rename bundle artifacts
        shell: bash
        run: |
          mkdir -p release
          find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release/ \;
          cd release
          shopt -s nullglob
          case "${{ matrix.platform }}" in
            windows)
              mv *.exe SmoothFlow-Windows-x64-setup.exe 2>/dev/null || true
              mv *.msi SmoothFlow-Windows-x64.msi 2>/dev/null || true
              ;;
            macos)
              mv *.dmg "SmoothFlow-macOS-$(uname -m).dmg"
              ;;
            linux)
              mv *.deb SmoothFlow-Linux-amd64.deb 2>/dev/null || true
              mv *.AppImage SmoothFlow-Linux-x86_64.AppImage 2>/dev/null || true
              ;;
          esac
          ls -la

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
