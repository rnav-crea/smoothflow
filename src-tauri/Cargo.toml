[package]
name = "smoothflow"
version = "0.1.1"
edition = "2021"
license = "MIT"
default-run = "smoothflow"

[lib]
name = "smoothflow_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3"
enigo = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
sha2 = "0.10"
nnnoiseless = "0.5"
arboard = "3"
regex = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

# ponytail: RNNoise is a neural net and the worst case for an unoptimized
# build — at opt-level 0 denoise() ran 4.3s for 48s of audio and every
# dictation felt broken. Optimizing just this one dependency makes dev
# builds representative of release without slowing the edit/compile loop.
[profile.dev.package.nnnoiseless]
opt-level = 3
