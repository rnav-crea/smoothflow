[package]
name = "smoothflow"
version = "0.1.1"
edition = "2021"
license = "MIT"
default-run = "smoothflow"

[lib]
name = "smoothflow_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3"
enigo = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
sha2 = "0.10"
nnnoiseless = "0.5"
arboard = "3"
regex = "1"
# On-demand engine download: the offline engines are unpacked from the zip
# archives published to the `engines` prerelease instead of shipping in the
# installer (~46 MB per install). deflate-only: the published archives use
# deflate and nothing else, so aes, bzip2, zstd and time stay out of the build.
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# Dictation history: SQLite (bundled compiles sqlite3.c via cc) with
# user_version-based migrations, modelled on Handy's history manager.
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"

# ponytail: RNNoise is a neural net and the worst case for an unoptimized
# build — at opt-level 0 denoise() ran 4.3s for 48s of audio and every
# dictation felt broken. Optimizing just this one dependency makes dev
# builds representative of release without slowing the edit/compile loop.
[profile.dev.package.nnnoiseless]
opt-level = 3
