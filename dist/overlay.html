<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmoothFlow</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    -webkit-app-region: no-drag;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
.bubble {
    background: rgba(0,0,0,0.8);
    border-radius: 12px;
    padding: 14px 32px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    animation: pulse 1.5s ease-in-out infinite;
}
.text {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 18px;
    user-select: none;
}
@keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
}
</style>
</head>
<body>
<div class="bubble"><span class="text">🎤 Recording...</span></div>
</body>
</html>
