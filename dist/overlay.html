<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmoothFlow Overlay</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    -webkit-app-region: no-drag;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
.bubble {
    background: #000000;
    border-radius: 9999px;
    padding: 6px 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.waveform {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 18px;
}
.bar {
    display: inline-block;
    width: 3px;
    border-radius: 9999px;
    background: #888eff;
    height: 4px;
    transition: height 0.05s ease-out;
}
</style>
</head>
<body>
<div class="bubble">
    <div class="waveform">
        <span class="bar" data-base="0.3"></span>
        <span class="bar" data-base="0.65"></span>
        <span class="bar" data-base="1.0"></span>
        <span class="bar" data-base="0.65"></span>
        <span class="bar" data-base="0.3"></span>
    </div>
</div>
<script>
const bars = document.querySelectorAll('.bar');
try {
    if (window.__TAURI_INTERNALS__) {
        window.__TAURI_INTERNALS__.listen('audio-level', (e) => {
            const level = Math.min(parseFloat(e.payload) || 0, 1);
            const maxH = 18;
            bars.forEach((bar) => {
                const base = parseFloat(bar.dataset.base);
                const targetH = Math.max(level * maxH * base, 3);
                bar.style.height = targetH + 'px';
            });
        });
    }
} catch (_) {}
</script>
</body>
</html>
